<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fluentemente</title>
<style>
body{font-family:Arial,sans-serif;background:#f5f4ef;color:#171717;margin:0}
main{max-width:1050px;margin:auto;padding:60px 20px}
h1{font-size:58px;letter-spacing:-3px;margin:0 0 10px}p{color:#666;line-height:1.6}
.box{background:white;padding:22px;border:1px solid #e5e2da;border-radius:18px;display:flex;gap:10px}
input{flex:1;padding:15px;border:1px solid #ddd;border-radius:10px;font-size:15px}
button{border:0;background:#171717;color:white;border-radius:10px;padding:15px 20px;font-weight:bold;cursor:pointer}
#status{min-height:25px}
#player{margin-top:30px;aspect-ratio:16/9;background:#111;border-radius:18px;overflow:hidden}
#player iframe{width:100%;height:100%;border:0}
.caption{background:#171717;color:white;text-align:center;padding:20px;border-radius:0 0 18px 18px}
.original{font-size:24px;font-weight:bold;margin:0}.translation{color:#ccc}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:30px}
.card{background:white;border:1px solid #e5e2da;border-radius:15px;padding:18px;cursor:pointer}
.card:hover{transform:translateY(-2px)}
@media(max-width:700px){h1{font-size:42px}.box{flex-direction:column}.cards{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
<p>YOUTUBE LANGUAGE LAB</p>
<h1>Fluentemente</h1>
<p>Cole um vídeo do YouTube de até 30 minutos e transforme a transcrição em material de estudo.</p>

<div class="box">
<input id="url" placeholder="https://www.youtube.com/watch?v=...">
<button id="go">Processar vídeo</button>
</div>
<p id="status"></p>

<div id="player"></div>
<div class="caption">
<p class="original" id="original">Aguardando vídeo...</p>
<p class="translation" id="translation">A tradução aparecerá aqui.</p>
</div>

<div id="cards" class="cards"></div>
</main>
<script src="https://www.youtube.com/iframe_api"></script>
<script>
const API="http://127.0.0.1:8000";
let data=null,player=null,index=0;

function getId(url){
 try{
  const u=new URL(url);
  if(u.hostname.includes("youtu.be")) return u.pathname.slice(1).split("/")[0];
  if(u.hostname.includes("youtube.com")) return u.searchParams.get("v")||u.pathname.split("/").filter(Boolean).pop();
 }catch(e){}
 return null;
}
function onYouTubeIframeAPIReady(){}
function createPlayer(id){
 if(player){player.loadVideoById(id);return}
 player=new YT.Player("player",{videoId:id,playerVars:{rel:0,modestbranding:1}});
}
function showPhrase(i){
 if(!data||!data.phrases.length)return;
 index=i;
 const p=data.phrases[i];
 document.getElementById("original").textContent=p.original;
 document.getElementById("translation").textContent="Tradução será adicionada nesta etapa.";
 if(player&&player.seekTo)player.seekTo(p.start,true);
}
function render(){
 const cards=document.getElementById("cards");
 cards.innerHTML=data.phrases.map((p,i)=>`<div class="card"><b>${p.original}</b><p>${p.start.toFixed(1)}s</p></div>`).join("");
 [...cards.children].forEach((c,i)=>c.onclick=()=>showPhrase(i));
 showPhrase(0);
}
document.getElementById("go").onclick=async()=>{
 const url=document.getElementById("url").value.trim();
 document.getElementById("status").textContent="Processando transcrição...";
 try{
  const r=await fetch(API+"/api/video",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({url,source_language:"fr",target_language:"pt"})});
  const j=await r.json();
  if(!r.ok)throw new Error(j.detail||"Erro");
  data=j;
  createPlayer(j.video.id);
  render();
  document.getElementById("status").textContent=`Vídeo reconhecido. ${j.phrases.length} unidades de legenda encontradas.`;
 }catch(e){document.getElementById("status").textContent="Erro: "+e.message}
};
</script>
</body>
</html>
